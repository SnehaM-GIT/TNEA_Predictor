<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profile - PickMySeat.AI</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <nav class="navbar">
    <div class="container">
      <div class="navbar-content">
        <a href="dashboard.html" class="navbar-brand">PickMySeat.AI</a>
        <ul class="navbar-nav">
          <li><a href="dashboard.html" class="nav-link">Dashboard</a></li>
          <li><a href="predict.html" class="nav-link">Predict</a></li>
          <li><a href="profile.html" class="nav-link active">Profile</a></li>
          <li><button class="btn btn-sm btn-outline" id="logout-btn">Logout</button></li>
        </ul>
      </div>
    </div>
  </nav>
  <main class="container-md py-8">
    <div id="alert-container"></div>
    <div id="profile-view" class="card hidden">
      <div class="card-body">
        <div class="flex justify-between items-center mb-6">
          <h2 class="text-2xl font-bold">Your Profile</h2>
          <button class="btn btn-outline" id="edit-profile-btn">Edit Profile</button>
        </div>
        <div class="grid grid-cols-2" id="profile-data"></div>
        <div id="payment-notice" class="mt-6 alert alert-warning hidden">
          <strong>Note:</strong> You need to complete payment to access predictions.
        </div>
      </div>
    </div>
    <div id="profile-edit" class="card hidden">
      <div class="card-body">
        <h2 class="text-2xl font-bold mb-6">Complete Your Profile</h2>
        <form id="profile-form">
          <div class="grid grid-cols-2">
            <div class="form-group">
              <label class="form-label" for="name">Full Name <span class="required">*</span></label>
              <input type="text" id="name" class="form-input" required>
            </div>
            <div class="form-group">
              <label class="form-label" for="phone">Phone <span class="required">*</span></label>
              <input type="tel" id="phone" class="form-input" required>
            </div>
            <div class="form-group">
              <label class="form-label" for="category">Category <span class="required">*</span></label>
              <select id="category" class="form-select" required>
                <option value="">Select Category</option>
                <option value="OC">OC - Open Competition</option>
                <option value="BC">BC - Backward Class</option>
                <option value="BCM">BCM - Backward Class Muslim</option>
                <option value="MBC">MBC - Most Backward Class</option>
                <option value="SC">SC - Scheduled Caste</option>
                <option value="ST">ST - Scheduled Tribe</option>
              </select>
            </div>
            <div class="form-group">
              <label class="form-label" for="district">District</label>
              <input type="text" id="district" class="form-input">
            </div>
            <div class="form-group">
              <label class="form-label" for="school">School Name</label>
              <input type="text" id="school" class="form-input">
            </div>
            <div class="form-group">
              <label class="form-label" for="tenth-mark">10th Mark (%)</label>
              <input type="number" id="tenth-mark" class="form-input" min="0" max="100" step="0.01">
            </div>
            <div class="form-group">
              <label class="form-label" for="twelfth-mark">12th Mark (%)</label>
              <input type="number" id="twelfth-mark" class="form-input" min="0" max="100" step="0.01">
            </div>
          </div>
          <div class="flex gap-4 mt-6">
            <button type="submit" class="btn btn-primary">Save Profile</button>
            <button type="button" class="btn btn-outline" id="cancel-edit-btn">Cancel</button>
          </div>
        </form>
      </div>
    </div>
  </main>
  <script src="js/app.js"></script>
</body>
</html>
