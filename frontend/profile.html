<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profile - PickMySeat.AI</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <nav class="navbar">
    <div class="container">
      <div class="navbar-content">
        <a href="#" class="navbar-brand">PickMySeat.AI</a>
        <ul class="navbar-nav">
          <li><a href="dashboard-grade2.html" class="nav-link">Dashboard</a></li>
          <li><a href="profile.html" class="nav-link active">Profile</a></li>
          <li><button class="btn btn-sm btn-outline" id="logout-btn">Logout</button></li>
        </ul>
      </div>
    </div>
  </nav>

  <main class="container-md py-8">
    <div id="alert-container"></div>

    <!-- Profile View -->
    <div id="profile-view" class="card hidden">
      <div class="card-body">
        <div class="flex justify-between items-center mb-6">
          <h2 class="text-2xl font-bold">Your Profile</h2>
          <button class="btn btn-outline" id="edit-profile-btn">Edit Profile</button>
        </div>
        <div class="grid grid-cols-2" id="profile-data"></div>
      </div>
    </div>

    <!-- Profile Edit -->
    <div id="profile-edit" class="card hidden">
      <div class="card-body">
        <h2 class="text-2xl font-bold mb-6">Complete Your Profile</h2>
        <form id="profile-form">
          <div class="grid grid-cols-2">
            <div class="form-group">
              <label class="form-label" for="name">Full Name <span class="required">*</span></label>
              <input type="text" id="name" class="form-input" required>
            </div>
            <div class="form-group">
              <label class="form-label" for="phone">Phone <span class="required">*</span></label>
              <input type="tel" id="phone" class="form-input" required>
            </div>
            <div class="form-group">
              <label class="form-label" for="category">Category <span class="required">*</span></label>
              <select id="category" class="form-select" required>
                <option value="">Select Category</option>
                <option value="OC">OC - Open Competition</option>
                <option value="BC">BC - Backward Class</option>
                <option value="BCM">BCM - BC Muslim</option>
                <option value="MBC">MBC - Most Backward Class</option>
                <option value="SC">SC - Scheduled Caste</option>
                <option value="ST">ST - Scheduled Tribe</option>
              </select>
            </div>
          </div>
          <div class="flex gap-4 mt-6">
            <button type="submit" class="btn btn-primary">Save Profile</button>
            <button type="button" class="btn btn-outline" id="cancel-edit-btn">Cancel</button>
          </div>
        </form>
      </div>
    </div>

    <!-- Preference Section (Grade 2 Only) -->
    <div id="preference-section" class="hidden mt-8">
      <div class="card">
        <div class="card-body">
          <h2 class="text-2xl font-bold mb-2">Set Your Preferences</h2>
          <p class="text-secondary mb-6">Choose up to 3 courses and 5 colleges to see probability combinations</p>

          <div class="grid grid-cols-2 gap-6">
            <!-- Courses -->
            <div>
              <h3 class="font-bold mb-4">Preferred Courses (Max 3)</h3>
              <div id="courses-checkboxes" class="space-y-2"></div>
            </div>

            <!-- Colleges -->
            <div>
              <h3 class="font-bold mb-4">Preferred Colleges (Max 5)</h3>
              <div id="colleges-checkboxes" class="space-y-2"></div>
            </div>
          </div>

          <button class="btn btn-primary mt-6" id="save-preferences-btn">Save Preferences</button>
        </div>
      </div>
    </div>
  </main>

  <script src="js/app.js"></script>
</body>
</html>
