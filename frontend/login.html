<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - PickMySeat.AI</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="container-sm py-8">
    <div class="card">
      <div class="card-body">
        <h2 class="card-title text-center mb-6">Login to PickMySeat.AI</h2>
        <div id="alert-container"></div>
        <form id="login-form">
          <div class="form-group">
            <label class="form-label" for="email">Email <span class="required">*</span></label>
            <input type="email" id="email" class="form-input" placeholder="your@email.com" required>
          </div>
          <div class="form-group">
            <label class="form-label" for="password">Password <span class="required">*</span></label>
            <input type="password" id="password" class="form-input" placeholder="••••••••" required>
          </div>
          <button type="submit" class="btn btn-primary btn-block">Login</button>
        </form>
        <div class="divider"><span>OR</span></div>
        <button class="btn btn-outline btn-block" id="google-login-btn">Continue with Google</button>
        <p class="text-center mt-6 text-secondary">
          Don't have an account? <a href="signup.html" class="text-primary font-bold">Sign up</a>
        </p>
      </div>
    </div>
  </div>
  <script src="js/app.js"></script>
</body>
</html>
