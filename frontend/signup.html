<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up - PickMySeat.AI</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="container-sm py-8">
    <div class="card">
      <div class="card-body">
        <h2 class="card-title text-center mb-6">Create Account</h2>
        <div id="alert-container"></div>
        <form id="signup-form">
          <div class="form-group">
            <label class="form-label" for="name">Full Name <span class="required">*</span></label>
            <input type="text" id="name" class="form-input" placeholder="John Doe" required>
          </div>
          <div class="form-group">
            <label class="form-label" for="email">Email <span class="required">*</span></label>
            <input type="email" id="email" class="form-input" placeholder="your@email.com" required>
          </div>
          <div class="form-group">
            <label class="form-label" for="phone">Phone Number</label>
            <input type="tel" id="phone" class="form-input" placeholder="+91 XXXXX XXXXX">
          </div>
          <div class="form-group">
            <label class="form-label" for="password">Password <span class="required">*</span></label>
            <input type="password" id="password" class="form-input" placeholder="••••••••" required>
            <div class="form-helper">Minimum 6 characters</div>
          </div>
          <div class="form-group">
            <label class="form-label" for="confirm-password">Confirm Password <span class="required">*</span></label>
            <input type="password" id="confirm-password" class="form-input" placeholder="••••••••" required>
          </div>
          <button type="submit" class="btn btn-primary btn-block">Sign Up</button>
        </form>
        <div class="divider"><span>OR</span></div>
        <button class="btn btn-outline btn-block" id="google-signup-btn">Continue with Google</button>
        <p class="text-center mt-6 text-secondary">
          Already have an account? <a href="login.html" class="text-primary font-bold">Login</a>
        </p>
      </div>
    </div>
  </div>
  <script src="js/app.js"></script>
</body>
</html>
