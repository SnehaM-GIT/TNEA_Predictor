<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Predict - PickMySeat.AI</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <nav class="navbar">
    <div class="container">
      <div class="navbar-content">
        <a href="dashboard.html" class="navbar-brand">PickMySeat.AI</a>
        <ul class="navbar-nav">
          <li><a href="dashboard.html" class="nav-link">Dashboard</a></li>
          <li><a href="predict.html" class="nav-link active">Predict</a></li>
          <li><a href="profile.html" class="nav-link">Profile</a></li>
          <li><button class="btn btn-sm btn-outline" id="logout-btn">Logout</button></li>
        </ul>
      </div>
    </div>
  </nav>
  <main class="container-md py-8">
    <div id="alert-container"></div>
    <div id="marks-form-container" class="card">
      <div class="card-body">
        <h2 class="text-2xl font-bold mb-6">Enter Your TNEA Marks</h2>
        <form id="marks-form">
          <div class="grid grid-cols-3">
            <div class="form-group">
              <label class="form-label" for="maths">Mathematics <span class="required">*</span></label>
              <input type="number" id="maths" class="form-input" placeholder="0-200" min="0" max="200" step="0.01" required>
            </div>
            <div class="form-group">
              <label class="form-label" for="physics">Physics <span class="required">*</span></label>
              <input type="number" id="physics" class="form-input" placeholder="0-200" min="0" max="200" step="0.01" required>
            </div>
            <div class="form-group">
              <label class="form-label" for="chemistry">Chemistry <span class="required">*</span></label>
              <input type="number" id="chemistry" class="form-input" placeholder="0-200" min="0" max="200" step="0.01" required>
            </div>
          </div>
          <div class="card mb-6" style="background: linear-gradient(135deg, #dbeafe 0%, #bfdbfe 100%);">
            <div class="card-body">
              <p class="text-sm text-secondary">Total Marks</p>
              <p class="text-2xl font-bold text-primary"><span id="total-marks">0.00</span> / 600</p>
            </div>
          </div>
          <div class="form-group">
            <label class="form-label" for="department">Preferred Department <span class="required">*</span></label>
            <select id="department" class="form-select" required>
              <option value="">Select Department</option>
              <option value="CSE">Computer Science Engineering</option>
              <option value="IT">Information Technology</option>
              <option value="ECE">Electronics & Communication</option>
              <option value="EEE">Electrical & Electronics</option>
              <option value="MECH">Mechanical Engineering</option>
              <option value="CIVIL">Civil Engineering</option>
              <option value="AI&DS">AI & Data Science</option>
            </select>
          </div>
          <button type="submit" class="btn btn-primary btn-block">Predict My Rank & Colleges</button>
        </form>
      </div>
    </div>
    <div id="results-container" class="hidden">
      <div class="stat-card mb-6">
        <h2 class="text-2xl font-bold mb-4">Your Predicted TNEA Rank</h2>
        <div class="flex items-center gap-4">
          <div class="text-4xl font-bold" id="rank-low">0</div>
          <div class="text-xl">to</div>
          <div class="text-4xl font-bold" id="rank-high">0</div>
        </div>
        <p class="mt-4" style="opacity: 0.9;">Based on total marks: <span class="font-bold" id="result-total">0</span></p>
      </div>
      <div class="card mb-6">
        <div class="card-body">
          <h3 class="text-lg font-bold mb-4">Your Marks Breakdown</h3>
          <div class="grid grid-cols-3">
            <div><p class="text-sm text-secondary">Mathematics</p><p class="text-2xl font-bold text-primary" id="result-maths">0</p></div>
            <div><p class="text-sm text-secondary">Physics</p><p class="text-2xl font-bold" style="color:#10b981;" id="result-physics">0</p></div>
            <div><p class="text-sm text-secondary">Chemistry</p><p class="text-2xl font-bold" style="color:#8b5cf6;" id="result-chemistry">0</p></div>
          </div>
        </div>
      </div>
      <div class="flex justify-between items-center mb-6">
        <h2 class="text-2xl font-bold">Recommended Colleges</h2>
        <button class="btn btn-outline" id="new-prediction-btn">New Prediction</button>
      </div>
      <div id="colleges-list"></div>
    </div>
  </main>
  <script src="js/app.js"></script>
</body>
</html>
