<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard - PickMySeat.AI</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <nav class="navbar">
    <div class="container">
      <div class="navbar-content">
        <a href="dashboard.html" class="navbar-brand">PickMySeat.AI</a>
        <ul class="navbar-nav">
          <li><a href="dashboard.html" class="nav-link active">Dashboard</a></li>
          <li><a href="predict.html" class="nav-link">Predict</a></li>
          <li><a href="profile.html" class="nav-link">Profile</a></li>
          <li><button class="btn btn-sm btn-outline" id="logout-btn">Logout</button></li>
        </ul>
      </div>
    </div>
  </nav>
  <main class="container py-8">
    <div class="mb-8">
      <h1 class="text-3xl font-bold mb-2">Welcome back!</h1>
      <p class="text-secondary" id="user-email">Loading...</p>
    </div>
    <div id="dashboard-content">
      <div class="grid grid-cols-3 mb-8">
        <div class="card"><div class="card-body">
          <p class="text-sm text-secondary mb-1">Account Status</p>
          <p class="text-2xl font-bold" id="account-status"></p>
        </div></div>
        <div class="card"><div class="card-body">
          <p class="text-sm text-secondary mb-1">Total Predictions</p>
          <p class="text-2xl font-bold" id="total-predictions">0</p>
        </div></div>
        <div class="card"><div class="card-body">
          <p class="text-sm text-secondary mb-1">Quick Action</p>
          <button class="btn btn-primary mt-2" id="quick-action-btn">Loading...</button>
        </div></div>
      </div>
      <div>
        <h2 class="text-2xl font-bold mb-4">Recent Predictions</h2>
        <div id="predictions-container"></div>
      </div>
    </div>
  </main>
  <script src="js/app.js"></script>
</body>
</html>
